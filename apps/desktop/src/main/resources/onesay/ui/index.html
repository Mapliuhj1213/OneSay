<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneSay</title>
<link rel="icon" href="favicon.ico">
<style>
/* 与手机计划 App 同一套：浅灰底、白色大圆角卡片、大标题、蓝色强调、文字 87% / 55% / 38%，每类一个颜色 */
:root{
  --bg:#F4F4F6; --card:#FFFFFF; --text:rgba(0,0,0,.87); --text2:rgba(0,0,0,.55); --text3:rgba(0,0,0,.38);
  --line:rgba(0,0,0,.08); --accent:#0381FE; --red:#E5484D; --green:#1FA463;
  --event:#3E7BFA; --todo:#FF9500; --ticket:#8E5CF7; --pickup:#1FA463; --auto:#00A3B4; --device:#5B6472;
  --r:22px; --r-s:14px;
  /* ★ console-align：替你操作 / 控屏状态徽标（与手机 exec/ControlColor 同色，见 docs/CONSOLE.md） */
  --ctl-run:#7C7CFF; --ctl-wait:#FFB020; --ctl-user:#34C759; --ctl-stop:#FF453A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
div.app{display:flex;height:100vh}

/* ---------- 侧栏 ---------- */
.side{width:232px;flex:none;padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 14px}
.logo{width:30px;height:30px;border-radius:10px;background:#0A5BFF;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;letter-spacing:-.3px}
.brand b{font-size:18px;font-weight:600;letter-spacing:.2px}
.devchip{margin:0 6px 14px;padding:10px 12px;border-radius:var(--r-s);background:var(--card);display:flex;align-items:center;gap:10px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(31,164,99,.15);flex:none}
.dot.off{background:#B5B8BE;box-shadow:none}
.devchip .t{display:flex;flex-direction:column;line-height:1.35}
.devchip .t span{color:var(--text3);font-size:12px}
.grp{font-size:12px;color:var(--text3);padding:12px 12px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;color:var(--text);font-size:14px;width:100%;text-align:left}
.nav:hover{background:rgba(0,0,0,.04)}
.nav.on{background:var(--card);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:12px;flex:none}
.nav .n{margin-left:auto;color:var(--text3);font-size:12px;font-weight:400}
.side .grow{flex:1}
.ptt{margin:6px;padding:12px;border-radius:var(--r-s);background:var(--card);font-size:12px;color:var(--text2);line-height:1.6}
.key{display:inline-block;min-width:44px;padding:1px 8px;border:1px solid rgba(0,0,0,.15);border-bottom-width:2px;border-radius:6px;font-size:11px;color:var(--text);background:#fafafa;text-align:center}

/* ---------- 主区 ---------- */
.main{flex:1;overflow:auto;padding:30px 40px 120px}
.page{display:none;max-width:1000px;margin:0 auto}
#workflows{max-width:none;height:calc(100vh - 48px)}
.main.wfmode{padding:14px 18px;overflow:hidden} .main.wfmode #workflows{height:calc(100vh - 28px)} /* [workflow-1120] 工作流页少留边，画布多占地方 */
.page.on{display:block}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}
.head h1{font-size:34px;font-weight:600;letter-spacing:.5px;line-height:1.1}
.head p{color:var(--text2);margin-top:8px;font-size:14px}
.head .sp{flex:1}
.head>.btn{flex:none;white-space:nowrap} /* [preview-1120 真机] 通知页「发一条测试 / 全部已读 / 清空」被挤成两行 */
.btn{height:36px;padding:0 16px;border-radius:18px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.sec{display:flex;align-items:center;gap:8px;margin:18px 6px 8px;font-size:13px;font-weight:600;color:var(--text2)}
.sec:first-child{margin-top:0}
.sec i{width:4px;height:14px;border-radius:2px}
.sec span{font-weight:400;color:var(--text3)}
.card{background:var(--card);border-radius:var(--r);padding:6px 0;overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:12px 20px;position:relative;min-height:58px}
.item+.item:before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:var(--line)}
.bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.item .tx{flex:1;min-width:0}
.item .tt{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .st{font-size:12.5px;color:var(--text2);margin-top:3px}
.item.past .tt,.item.past .st{color:var(--text3)}
.item.done .tt{color:var(--text3);text-decoration:line-through}
.time{width:52px;flex:none;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
.time small{display:block;font-weight:400;color:var(--text3);font-size:12px}
.tag{font-size:11.5px;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.05);color:var(--text2);flex:none}
.tag.red{background:rgba(229,72,77,.1);color:var(--red)}
.tag.green{background:rgba(31,164,99,.1);color:var(--green)}
.tag.blue{background:rgba(3,129,254,.1);color:var(--accent)}
.tag.run{background:rgba(124,124,255,.16);color:#5B5BE6}.tag.wait{background:rgba(255,176,32,.18);color:#B57400}
.tag.user{background:rgba(52,199,89,.16);color:#1E8E3E}.tag.stop{background:rgba(255,69,58,.14);color:#D7261C}
/* ★ console-align：危险项（清空 / 删除 / 撤销 / 换一把钥匙…）一律红字；确认框「X？」+ 一句后果 */
.btn.danger,.btn.ghost.danger{color:var(--red)} button.tag.danger{background:rgba(229,72,77,.1);color:var(--red)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px}
.toc span{font-size:12.5px;padding:6px 12px;border-radius:14px;background:var(--card);color:var(--text2);cursor:pointer}
.toc span:hover{color:var(--accent)}
.setcol{max-width:760px}
.grp-h{padding-top:22px}.grp-h:first-child{padding-top:0}
.pill{font-size:12px;font-weight:600;padding:5px 12px;border-radius:14px;flex:none}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--todo);flex:none}
.chk.on{background:var(--todo);position:relative}
.chk.on:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.code{font-size:22px;font-weight:600;letter-spacing:1px;font-variant-numeric:tabular-nums}
.empty{padding:26px 20px;text-align:center;color:var(--text3);font-size:13px}
.sw{width:42px;height:24px;border-radius:12px;background:#D4D6DA;position:relative;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}
.sw.on:after{left:21px}
.ticket{border-radius:var(--r);background:var(--card);padding:18px 22px;display:flex;gap:18px;align-items:center;margin-bottom:12px}
.ticket .stn{text-align:center;min-width:90px}
.ticket .stn b{font-size:24px;font-weight:600;display:block}
.ticket .mid{flex:1;text-align:center;color:var(--text3);font-size:12px}
.ticket .mid hr{border:0;border-top:1px dashed rgba(0,0,0,.2);margin:6px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{background:var(--card);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.tile .tt{font-size:15px;font-weight:600}
.tile .st{font-size:12.5px;color:var(--text2);line-height:1.5}
.tile .row{display:flex;gap:6px;margin-top:auto}
.kv{display:flex;align-items:center;gap:14px;padding:14px 20px;position:relative}
.kv+.kv:before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:var(--line)}
.kv .k{flex:1}
.kv .k div{font-size:15px}
.kv .k p{font-size:12.5px;color:var(--text2);margin-top:3px}
.kv .v{color:var(--text2);font-size:13px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg span{padding:5px 12px;border-radius:8px;font-size:12.5px;color:var(--text2);cursor:pointer}
.seg span.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{height:32px;border-radius:10px;background:var(--bg);padding:0 12px;display:flex;align-items:center;min-width:220px;color:var(--text2);font-size:13px}
.hero{background:var(--card);border-radius:var(--r);padding:22px 24px;display:flex;align-items:center;gap:18px;margin-bottom:6px}
.hero .big{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:24px;flex:none}
.hero h2{font-size:20px;font-weight:600}
.hero p{color:var(--text2);font-size:13px;margin-top:4px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 6px}
.act{background:var(--card);border-radius:var(--r-s);padding:16px;display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600;text-align:left}
.act span{font-size:12px;color:var(--text3);font-weight:400}
.act .ic{width:30px;height:30px;border-radius:10px;font-size:14px}
.qr{width:150px;height:150px;border-radius:14px;background:#fff;border:1px solid var(--line);padding:10px}
.log{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px;color:var(--text2);line-height:1.9;padding:14px 20px}
.log b{color:var(--text);font-weight:400}
.mrdrop{margin:8px 20px 14px;border:1.5px dashed var(--line,#ccd);border-radius:12px;padding:16px;text-align:center;font-size:13px;color:var(--text2);line-height:1.6}
.mrdrop.on{border-color:var(--accent);background:rgba(3,129,254,.06);color:var(--accent)}
.mrapps{max-height:260px;overflow:auto;margin:0 20px 12px}
.note{font-size:12px;color:var(--text3);margin:10px 6px 0;line-height:1.6}

/* ---------- 说话浮条（实际在屏幕底部居中，任何程序之上） ---------- */
.voice{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;transition:.18s;
  background:#1F2228;color:#fff;border-radius:28px;padding:12px 24px;display:flex;align-items:center;gap:12px;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.25);white-space:nowrap}
.voice.show{opacity:1;transform:translateX(-50%) translateY(0)}
.voice .rec{width:10px;height:10px;border-radius:50%;background:#FF453A;animation:pulse 1s infinite}
.wave{display:flex;gap:3px;align-items:center;height:18px}
.wave i{width:3px;border-radius:2px;background:#fff;opacity:.85;animation:w .9s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
.voice .hint{color:rgba(255,255,255,.5);font-size:12px}
.voice .ok{color:#30D158}
@keyframes pulse{50%{opacity:.35}}
@keyframes w{0%,100%{height:4px}50%{height:18px}}
.demo{position:fixed;right:18px;bottom:18px;font-size:12px;color:var(--text3);background:var(--card);border-radius:12px;padding:8px 12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- 弹窗：设闹钟（设在手机上） ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center}
.mask.on{display:flex}
/* ★ fix-1114：页面自己的确认框（不用浏览器 confirm()）：标题是这件事本身，默认焦点在「取消」，危险的确认按钮红色 */
#askbox .box{background:var(--bg,#fff);color:var(--text);border-radius:14px;min-width:300px;max-width:440px;padding:18px 20px 14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#askbox h3{margin:0 0 8px;font-size:16px}#askbox .bd{white-space:pre-wrap;font-size:13px;line-height:1.6;color:var(--text2)}
#askbox .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}#askbox .ok.danger{background:var(--red);color:#fff}
.sheet{width:420px;background:var(--card);border-radius:26px;padding:24px}
.sheet h3{font-size:18px;font-weight:600}
.sheet .sub{font-size:12.5px;color:var(--text2);margin-top:4px}
.clock{font-size:56px;font-weight:300;text-align:center;margin:22px 0 10px;font-variant-numeric:tabular-nums;letter-spacing:2px}
.days{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.days span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--bg);color:var(--text2)}
.days span.on{background:var(--accent);color:#fff}
.sheet .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* ★ design-1118：OneSay 设计语言 v1（与手机控制台同一套 token，见手机 docs/CONSOLE.md 第七节）。
   安静的底色，颜色只表达意思：主色苔绿 = 开着 / 主要动作；红黄绿灰 = 状态；蓝紫 = 控屏（--ctl-*，不变）。跟随系统深浅色。 */
:root{
  --bg:#F5F4F1; --card:#FFFFFF; --surface2:#EEECE7; --text:#1C1B19; --text2:#5F5C57; --text3:#75726C; --line:#E6E3DD;
  --accent:#4E7A35; --accentC:#E3EDDA; --red:#C9363B; --green:#1F7A44; --warn:#845A0B; --swoff:#D6D2CA; --r:20px;
}
/* [preview-1120] 主题插件：浅色 / 深色 / 跟随系统由 <html data-theme> 决定（脚本按设置和系统设上），主题包再用 CSS 变量覆盖 */
:root{--hover:rgba(0,0,0,.04);--chip:rgba(0,0,0,.05);--shadow:rgba(0,0,0,.08)}
:root[data-theme=dark]{--bg:#101012; --card:#1B1B1E; --surface2:#26262A; --text:#F2F1EE; --text2:#A9A7A2; --text3:#8C8A85; --line:#2E2E33;
    --accent:#84AE64; --accentC:#26321F; --red:#F0575C; --green:#5BC27A; --warn:#F2B33D; --swoff:#3A3A3F; --hover:rgba(255,255,255,.05); --chip:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.4)}
:root[data-mode=dark] .qr{background:#fff}
.logo{background:var(--accent)} .btn{color:var(--card)} .btn.ghost{background:var(--card);color:var(--accent)}
.sec i{display:none}                                   /* 分组标题不再加彩色竖条 */
.side .ic,.nav .ic{background:var(--surface2)!important;color:var(--text2)}   /* 侧栏图标统一单色 */
.nav.on .ic{background:var(--accentC)!important;color:var(--accent)}
.sw{background:var(--swoff)} .sw.on{background:var(--accent)}
.tag.green{background:rgba(31,122,68,.12);color:var(--green)} .tag.blue{background:var(--accentC);color:var(--accent)}
.dot{background:var(--green)}
</style><style>
/* ---------- 对话（单一对话，类 Codex） ---------- */
#chat.on{display:flex}
#chat{position:relative}
#chat{flex-direction:column;height:calc(100vh - 30px);margin-top:-30px;max-width:none;padding-bottom:0}
.main.chatmode{padding-bottom:0;overflow:hidden}
.chatbar{display:flex;align-items:center;gap:10px;padding:18px 0 12px;max-width:820px;width:100%;margin:0 auto}
.chatbar h1{font-size:22px;font-weight:600}
.chip{font-size:12px;color:var(--text2);background:var(--card);border-radius:12px;padding:5px 10px;cursor:pointer}
.chip:hover{color:var(--accent)}
.chip.danger,.chip.danger:hover{color:var(--red)}
.msgs{flex:1;overflow:auto;padding:8px 0 24px}
.msgs .in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.m{line-height:1.75;font-size:15px;white-space:pre-wrap;word-break:break-word}
.m.u{align-self:flex-end;background:var(--card);border-radius:18px 18px 4px 18px;padding:10px 16px;max-width:78%}
.m.a{align-self:flex-start;max-width:100%;padding:0 4px}
.m.a.cmd{color:var(--text2);font-size:13.5px;display:flex;gap:8px;align-items:center}
.m.a.cmd:before{content:"⚡";color:var(--auto)}
.m.a.error{color:var(--red);font-size:13.5px}
.m.a.step{color:var(--text2);font-size:13px;line-height:1.6;border-left:2px solid var(--line,#444);padding-left:10px;font-family:ui-monospace,Consolas,monospace}
.m .via{display:block;font-size:11px;color:var(--text3);margin-top:2px}
/* [approvals-1118] 任务卡：一件事一张卡，每步一句人话 + 状态，命令和输出收在「详情」里，批准 / 选择在卡里点 */
.m.a.tc{align-self:stretch;background:var(--card);border-radius:18px;padding:14px 18px 12px;box-shadow:0 1px 2px rgba(0,0,0,.04);white-space:normal;font-size:14px;line-height:1.6}
.tc .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tc .hd .ti{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc .st{font-size:11.5px;padding:2px 9px;border-radius:10px;font-weight:600;flex:none}
.st.running{background:rgba(3,129,254,.1);color:var(--accent)}.st.done{background:rgba(31,164,99,.12);color:var(--green)}
.st.fail{background:rgba(229,72,77,.1);color:var(--red)}.st.warnc{background:rgba(255,204,0,.18);color:#8A6A00}.st.wait{background:rgba(255,149,0,.14);color:#B86400}.st.stop{background:rgba(0,0,0,.06);color:var(--text2)}
.tc .sp{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.tc .sp .ic{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;margin-top:2px;font-weight:700}
.ic.run{border:2px solid var(--accent);border-right-color:transparent;animation:spin 1s linear infinite}
.pbar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin:6px 0 2px;position:relative}.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.pbar.ind i{width:30%;position:absolute;animation:pind 1.2s ease-in-out infinite}@keyframes pind{0%{left:-30%}100%{left:100%}}
.pline{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text2)}
.ic.ok{background:var(--green);color:#fff}.ic.warn{background:#F5B400;color:#fff}.tc .sp .wn{color:#8A6A00;font-size:12.5px}.tc .md b{font-weight:600}.md pre.mdpre{margin:6px 0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:12.5px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:var(--text)}.md pre.mdpre code{background:none;padding:0}.md table.mdt{border-collapse:collapse;margin:6px 0;font-size:14px;line-height:1.5;white-space:normal}.md .mdt th,.md .mdt td{border:1px solid var(--line);padding:4px 10px;text-align:left;vertical-align:top}.md .mdt th{background:var(--surface2);font-weight:600}.tc .md code,.m .md code{font:12px ui-monospace,Consolas,monospace;background:var(--bg);padding:0 4px;border-radius:4px}.ic.fail{background:var(--red);color:#fff}.ic.wait{background:#FF9500;color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.tc .sp .bd{flex:1;min-width:0}.tc .sp .ds{color:var(--text)}.tc .sp .er{color:var(--red);font-size:12.5px}
.tc .sp .ok1{color:var(--text3);font-size:12.5px}
/* [devtools-1118] 任务卡里的截图 / 文件，点开在内置查看器里看 */
.tc .shot{margin:6px 0 2px}.tc .shot img{max-width:100%;max-height:320px;border-radius:8px;border:1px solid var(--line,#ddd);cursor:zoom-in;display:block;background:#f4f4f4;min-height:40px}

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">One</div><b>OneSay</b></div>
    <button class="devchip" id="devchip" onclick="devchipGo()" title="连接手机"><i class="dot" id="pdot"></i><div class="t"><span style="color:var(--text);font-size:13px" id="pline">手机离线</span><span id="pline2">等待手机连接</span></div><span class="go" id="pgo">配对</span></button>
    <div class="navs">

    <button class="nav" data-p="chat"><span class="ic" style="background:linear-gradient(135deg,#0381FE,#00A3B4)"><svg class="i"><use href="#i-message-circle"/></svg></span>对话</button>
    <button class="nav on" data-p="today"><span class="ic" style="background:var(--accent)"><svg class="i"><use href="#i-sun"/></svg></span>今天</button>
    <button class="nav" data-p="notes"><span class="ic" style="background:var(--red)"><svg class="i"><use href="#i-bell"/></svg></span>通知<span class="badge" id="nbadge" style="display:none"></span></button>

    <div class="grp">计划</div>
    <button class="nav" data-p="events"><span class="ic" style="background:var(--event)"><svg class="i"><use href="#i-calendar"/></svg></span>日程<span class="n" id="c-events"></span></button>
    <button class="nav" data-p="todos"><span class="ic" style="background:var(--todo)"><svg class="i"><use href="#i-square-check-big"/></svg></span>待办<span class="n" id="c-todos"></span></button>
    <button class="nav" data-p="tickets"><span class="ic" style="background:var(--ticket)"><svg class="i"><use href="#i-ticket"/></svg></span>票夹<span class="n" id="c-tickets"></span></button>
    <button class="nav" data-p="pickups"><span class="ic" style="background:var(--pickup)"><svg class="i"><use href="#i-package"/></svg></span>取件<span class="n" id="c-pickups"></span></button>
    <button class="nav" data-p="autos"><span class="ic" style="background:var(--auto)"><svg class="i"><use href="#i-repeat"/></svg></span>自动任务</button>
    <button class="nav" data-p="shortcuts"><span class="ic" style="background:var(--auto)"><svg class="i"><use href="#i-zap"/></svg></span>快捷指令</button>
    <button class="nav" data-p="workflows"><span class="ic" style="background:var(--auto)"><svg class="i"><use href="#i-repeat"/></svg></span>工作流</button>

    <div class="grp">设备</div>
    <button class="nav" data-p="phone"><span class="ic" style="background:var(--device)"><svg class="i"><use href="#i-smartphone"/></svg></span>手机</button>
    <button class="nav" data-p="mirror"><span class="ic" style="background:var(--device)"><svg class="i"><use href="#i-cast"/></svg></span>手机投屏</button>
    <button class="nav" data-p="pc"><span class="ic" style="background:var(--device)"><svg class="i"><use href="#i-monitor"/></svg></span>这台电脑</button>

    </div>
    <div class="foot">
    <button class="nav" data-p="settings"><span class="ic" style="background:#8A8F98"><svg class="i"><use href="#i-settings"/></svg></span>设置</button>
    <div class="ptt" id="pttbox">按住 <span class="key">空格</span> 说话<br><span id="vstat">松手执行，Esc 取消</span></div>
    </div>
  </aside>

  <main class="main" id="main">
    <section class="page" id="chat">
      <div class="chatbar"><h1>对话</h1><div class="sp" style="flex:1"></div><span class="chip" id="memchip" onclick="memOpen()">记忆</span><span class="chip" onclick="chatNew()">新对话</span><span class="chip danger" onclick="chatClear()">清空对话</span></div>
      <div class="msgs" id="msgs"><div class="in" id="msgin"></div></div>
      <div id="attrow" class="attrow" style="display:none"></div>
      <div class="compose" id="compose"><button class="attbtn" title="添加图片或文件（也可以直接粘贴截图、拖进来）" onclick="$('attfile').click()"><svg class="i"><use href="#i-paperclip"/></svg></button><input type="file" id="attfile" multiple style="display:none" onchange="attFiles(this.files);this.value=''"><textarea id="ta" rows="1" placeholder="说点什么，或者直接下指令；截图可以直接粘贴（Ctrl+V）或拖进来"></textarea><button class="send" id="sendbtn" onclick="chatSend()" title="发送"><svg class="i"><use href="#i-arrow-up"/></svg></button></div>
       <div class="hintline" id="chathint">Enter 发送，Shift+Enter 换行 · 截图可粘贴 / 拖进来 · 只有一个对话，旧内容自动截断，记忆自动更新、和手机共用</div>
    </section>
    <section class="page on" id="today"></section>
    <section class="page" id="notes"></section>
    <section class="page" id="events"></section>
    <section class="page" id="todos"></section>
    <section class="page" id="tickets"></section>
    <section class="page" id="pickups"></section>
    <section class="page" id="autos"></section>
    <section class="page" id="shortcuts"></section>
    <section class="page" id="workflows"></section>
    <section class="page" id="phone"></section>
    <section class="page" id="mirror"></section>
    <section class="page" id="pc"></section>
    <section class="page" id="settings"></section>

  const danger=isDanger(title)||/^(关掉|删除|清空|撤销|忘掉|换一把|打开「完全访问」|审批策略改成「从不」|再确认一次|加进应用白名单|让手机同步来的|清空重建)/.test(title);
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="ask-t"><h3 id="ask-t">${esc(title)}</h3>${body?`<div class="bd">${esc(body)}</div>`:''}<div class="ft"><button class="btn ghost sm" id="ask-no">取消</button><button class="btn sm ok${danger?' danger':''}" id="ask-ok">${esc(okText||'确定')}</button></div></div>`;
  const done=v=>{m.classList.remove('on');m.innerHTML='';document.removeEventListener('keydown',key,true);res(v)};
  const key=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(false)}};
  document.addEventListener('keydown',key,true);
  m.onclick=e=>{if(e.target===m)done(false)};$('ask-no').onclick=()=>done(false);$('ask-ok').onclick=()=>done(true);

async function wlOk(platform,id,name){if(!LIVE){snack('演示模式不能改');return}
  const r=await api('whitelist',{op:'risk',platform,id,name});if(!r.ok){snack(r.text);return}
  if(!await confirm('让手机同步来的「'+(name||id)+'」在电脑上生效？\n\n'+r.text))return;
  const a=await api('whitelist',{op:'confirm',platform,id,confirmed:true});snack(a.text);refresh()}
async function wlAdd(){const platform=$('wl-pf').value,id=$('wl-id').value.trim(),name=$('wl-name').value.trim();if(!id){snack('写上程序名或包名');return}
  if(!LIVE){snack('演示模式不能改');return}
  const r=await api('whitelist',{op:'risk',platform,id,name});if(!r.ok){snack(r.text);return}
  if(!await confirm('加进应用白名单？\n\n'+r.text))return;
  const a=await api('whitelist',{op:'add',platform,id,name,confirmed:true});snack(a.text);if(a.ok){$('wl-id').value='';$('wl-name').value=''}refresh()}
async function wlDel(platform,id){if(!await confirm('把「'+id+'」移出应用白名单？\n\n移出后在这个应用里的操作会照常先问你，手机上也会同步删掉。'))return;
  if(!LIVE){S.whitelist=(S.whitelist||[]).filter(x=>!(x.platform===platform&&x.id===id));render();return}
  const r=await api('whitelist',{op:'remove',platform,id});snack(r.text);refresh()}
async function wlReset(){if(!await confirm('清空重建应用白名单？\n\n读坏的文件会被覆盖，白名单变成空的；之后和手机同步时，手机上的条目会同步回来。'))return;
  const r=await api('whitelist',{op:'reset'});snack(r.text);refresh()}
async function remRevoke(k){const x=(S.remembered||[]).find(r=>r.kind===k);if(!await confirm('撤销「'+((x&&x.zh)||k)+'」？\n\n撤销后下次再做这件事会先问你。'))return;
  if(!LIVE){S.remembered=(S.remembered||[]).filter(x=>x.kind!==k);render();return}
  const r=await api('remembered',{op:'revoke',kind:k});snack(r.text);refresh()}
async function scRevoke(id){if(!await confirm('撤销「'+id+'」？\n\n撤销后手机再触发这个快捷指令会先问你。'))return;

function applySetFilter(){const root=$('settings');if(!root)return;const q=setQ.trim().toLowerCase();
  root.querySelectorAll('.kv,.ms,.th,.item').forEach(e=>e.classList.toggle('hidden-by-q',!!q&&!e.textContent.toLowerCase().includes(q)));
  root.querySelectorAll('.card').forEach(c=>{const any=[...c.children].some(x=>!x.classList.contains('hidden-by-q'));c.classList.toggle('hidden-by-q',!!q&&!any)});
  root.querySelectorAll('.grp-h,.sec').forEach(h=>h.classList.toggle('hidden-by-q',!!q));

// 逗号分隔的列表（域名、程序名）→ 标签 + 输入框，回车加一个；格式不对当场说
const DOMAIN_RX=/^(\*\.)?([a-z0-9-]+\.)+[a-z]{2,}$/i, EXE_RX=/^[^\\/:*?"<>|]+\.exe$/i;
function listOf(v){return String(v||'').split(/[,，;；\s]+/).map(x=>x.trim()).filter(Boolean)}
const chipList=(key,val,ph,kind)=>`<div class="chips">${listOf(val).map(x=>`<span class="c">${esc(x)}<button title="移除" onclick="chipDel('${key}',${esc(JSON.stringify(x))})">${ico('x')}</button></span>`).join('')}<input placeholder="${esc(ph)}" onkeydown="if(event.key==='Enter'){chipAdd('${key}','${kind}',this)}"><button class="tag" onclick="chipAdd('${key}','${kind}',this.previousElementSibling)">添加</button></div>`;
async function chipAdd(key,kind,el){const v=el.value.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');if(!v)return;
  if(kind==='domain'&&!DOMAIN_RX.test(v)){snack('「'+v+'」不像域名：写成 github.com 这样，不要带 http:// 和路径');return}
  if(kind==='exe'&&!EXE_RX.test(v)){snack('写程序文件名，例如 mstsc.exe');return}
  const cur=listOf(S.settings[key]);if(cur.includes(v)){snack('已经有了');return}cur.push(v);el.value='';await setv(key,cur.join(','))}
async function chipDel(key,v){await setv(key,listOf(S.settings[key]).filter(x=>x!==v).join(','))}

function appsList(v){return String(v||'').split(';').map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf('=');return i>0?[x.slice(0,i).trim(),x.slice(i+1).trim()]:[x,'']})}
function appsSave(l){return setv('apps',l.map(([n,p])=>n+'='+p).join(';'))}

async function appAdd(){const n=($('app-new').value||'').trim();if(!n){snack('先写名字（手机上说「打开 …」时用的名字）');return}if(/[=;]/.test(n)){snack('名字里不能有 = 或 ;');return}
  if(appsList(S.settings.apps).some(([x])=>x===n)){snack('已经有「'+n+'」了');return}
  const r=await api('pick',{kind:'exe',title:'选「'+n+'」的程序（.exe）'});if(!r.ok){snack(r.text);return}

async function appPick(i){const l=appsList(S.settings.apps);const r=await api('pick',{kind:'exe',title:'选「'+l[i][0]+'」的程序（.exe）'});if(!r.ok){snack(r.text);return}l[i][1]=r.path;await appsSave(l)}
async function appDel(i){const l=appsList(S.settings.apps);if(!await confirm('删除「'+l[i][0]+'」？\n\n手机就不能再让电脑打开它了。'))return;l.splice(i,1);await appsSave(l)}

let MCPF=null;
function mcpTry(id){const x=((S.mcp||{}).servers||[]).find(s=>s.id===id);if(!x)return;const ro=(x.tools||[]).filter(t=>t.read_only);if(!ro.length)return;

function mcpTool(n){MCPF.tool=n;MCPF.vals={};MCPF.out='';MCPF.err='';render()}
function mcpVal(k,v){MCPF.vals[k]=v}
function mcpForm(x){if(!MCPF||MCPF.id!==x.id)return '';const ro=(x.tools||[]).filter(t=>t.read_only),t=ro.find(t=>t.name===MCPF.tool)||ro[0];if(!t)return '';
  const sc=t.schema||{},props=sc.properties||{},req=sc.required||[],ks=Object.keys(props);
  return `<div class="mcpform">${ro.length>1?`<div class="kv"><div class="k"><div>选工具</div><p>只列服务器标了「只读」的</p></div><select class="field" onchange="mcpTool(this.value)">${ro.map(o=>`<option value="${esc(o.name)}" ${o.name===t.name?'selected':''}>${esc(o.title||o.name)}</option>`).join('')}</select></div>`:`<div style="font-weight:600">${esc(t.title||t.name)}</div>`}
  ${t.description?`<div class="mm">${esc(t.description)}</div>`:''}
  ${ks.length?ks.map(k=>mcpField(k,props[k]||{},req.includes(k))).join(''):'<p class="note" style="margin:6px 0 0">这个工具不用填参数</p>'}
  <div class="row"><button class="btn sm" onclick="mcpRun()">${ico('play')}运行</button><button class="tag" onclick="MCPF=null;render()">收起</button></div>
  ${MCPF.err?`<div class="errline">${esc(MCPF.err)}</div>`:''}${MCPF.out?`<pre class="pout">${esc(MCPF.out)}</pre>`:''}</div>`}
function mcpField(k,p,req){const has=Object.prototype.hasOwnProperty.call(MCPF.vals,k),v=has?MCPF.vals[k]:(p.default!==undefined?p.default:''),ty=['string','number','integer','boolean','array','object'].includes(p.type)?p.type:'string';
  const lab=`<div class="k"><div>${esc(k)}${req?' <span class="tag">必填</span>':''}</div><p>${esc(p.description||'')}</p></div>`;let c;
  if(p.enum)c=`<select class="field" data-k="${esc(k)}" onchange="mcpVal(this.dataset.k,this.value)">${req?'':'<option value="">（不填）</option>'}${p.enum.map(e=>`<option value="${esc(e)}" ${String(e)===String(v)?'selected':''}>${esc(e)}</option>`).join('')}</select>`;
  else if(ty==='boolean')c=`<span class="sw ${v===true||v==='true'?'on':''}" role="switch" tabindex="0" aria-checked="${v===true||v==='true'}" data-k="${esc(k)}" style="cursor:pointer" onclick="mcpVal(this.dataset.k,!this.classList.contains('on'));this.classList.toggle('on');this.setAttribute('aria-checked',this.classList.contains('on'))"></span>`;
  else if(ty==='number'||ty==='integer')c=`<input class="field" type="number" ${ty==='integer'?'step="1"':''} data-k="${esc(k)}" value="${esc(v)}" oninput="mcpVal(this.dataset.k,this.value)">`;
  else if(ty==='array')c=`<textarea class="field ta" style="min-height:60px" data-k="${esc(k)}" placeholder="每行一项" oninput="mcpVal(this.dataset.k,this.value)">${esc(Array.isArray(v)?v.join('\n'):v)}</textarea>`;
  else if(ty==='object')c=`<textarea class="field ta" style="min-height:60px" data-k="${esc(k)}" placeholder="写成 JSON，比如 {&quot;a&quot;: 1}" oninput="mcpVal(this.dataset.k,this.value)">${esc(typeof v==='string'?v:JSON.stringify(v))}</textarea>`;
  else c=`<input class="field" data-k="${esc(k)}" value="${esc(v)}" oninput="mcpVal(this.dataset.k,this.value)">`;
  return `<div class="kv">${lab}${c}</div>`}
async function mcpRun(){const x=((S.mcp||{}).servers||[]).find(s=>s.id===MCPF.id);if(!x)return;const t=(x.tools||[]).filter(t=>t.read_only).find(t=>t.name===MCPF.tool);if(!t)return;
  const sc=t.schema||{},props=sc.properties||{},req=sc.required||[],args={};MCPF.err='';
  for(const k of Object.keys(props)){const p=props[k]||{},has=Object.prototype.hasOwnProperty.call(MCPF.vals,k);let v=has?MCPF.vals[k]:p.default;
    if(v===undefined||v===''){if(req.includes(k)){MCPF.err='「'+k+'」要填';render();return}continue}
    if(p.type==='number'||p.type==='integer'){const n=Number(v);if(!isFinite(n)||(p.type==='integer'&&!Number.isInteger(n))){MCPF.err='「'+k+'」要填'+(p.type==='integer'?'整数':'数字');render();return}v=n}
    else if(p.type==='boolean')v=v===true||v==='true';
    else if(p.type==='array')v=Array.isArray(v)?v:String(v).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    else if(p.type==='object'&&typeof v==='string'){try{v=JSON.parse(v)}catch(e){MCPF.err='「'+k+'」不是合法的 JSON';render();return}}
    args[k]=v}
  MCPF.out='正在运行…';render();
  const r=await api('mcp',{op:'try',fn:'mcp__'+x.id+'__'+t.name.replace(/[^A-Za-z0-9_-]+/g,'_'),arguments:args});
  MCPF.out=r.ok?String(r.output||r.text||'（没有输出）').slice(0,4000):'';MCPF.err=r.ok?'':r.text;render()}

function md(t){let h=esc(String(t||'').replace(/\u0000/g,''));
  // [preview-1120] 真机：要求 Markdown 时模型会给表格 / 代码块，以前原样露出 | --- | 和 ```。先把块级的换成占位，再做行内的
  const B=[],keep=x=>{B.push(x);return '\u0000'+(B.length-1)+'\u0000'};
  const inl=s=>s.replace(/`([^`\n]{1,200})`/g,'<code>$1</code>').replace(/\*\*([^*\n]{1,300}?)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\n]{1,200}?)\*(?!\*)/g,'$1$2');
  h=h.replace(/(^|\n)[ \t]*```[ \t]*([\w+#.-]{0,20})[ \t]*\n([\s\S]*?)\n?[ \t]*```[ \t]*(?=\n|$)/g,(m,pre,lang,code)=>pre+keep('<pre class="mdpre"'+(lang?' data-lang="'+lang+'"':'')+'><code>'+code+'</code></pre>'));
  const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>inl(c.trim()));
  h=h.replace(/(^|\n)([ \t]*\|[^\n]*\|[ \t]*)\n(?=[^\n]*\|)[ \t]*\|?[ \t]*:?-+:?[ \t]*(?:\|[ \t]*:?-+:?[ \t]*)*\|?[ \t]*((?:\n[ \t]*\|[^\n]*\|[ \t]*)*)/g,(m,pre,head,body)=>{
    const rows=body.split('\n').filter(r=>r.trim());
    return pre+keep('<table class="mdt"><tr>'+cells(head).map(c=>'<th>'+c+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+cells(r).map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table>')});
  h=inl(h);
  h=h.replace(/^#{1,6}\s+(.+)$/gm,'<b>$1</b>').replace(/^\s*[-*]\s+/gm,'• ');
  return h.replace(/\u0000(\d+)\u0000\n?/g,(m,i)=>B[+i])}

  const out=String(x.output||''),long=out.length>600;
  const det=`<details><summary>详情</summary><pre>${esc(x.detail||'')}</pre>${out?`<pre id="out-${i}">${esc(long?out.slice(0,600)+'…':out)}</pre>${long?`<button class="tag" onclick="this.previousElementSibling.textContent=decodeURIComponent('${encodeURIComponent(out)}');this.remove()">展开全部（${out.length} 字）</button>`:''}`:''}</details>`;

function taskCard(x,last){const st=STATE_ZH[x.state]||[x.state||'',''],running=x.state==='running';
  const conf=((S.confirms||[]).filter(c=>c.from==='本机对话'&&(c.task===x.task||(!c.task&&running))));
  const ch=((S.choices||[]).filter(c=>c.task===x.task));
  const waiting=conf.length||ch.length;
  const prog=running&&S.progress&&S.progress.task===x.task?S.progress:null;
  const steps=(x.steps||[]).map((y,i)=>stepHtml(y,i,prog)).join('');
  const ans=x.answer?`<div class="ans md ${x.state==='done'||x.state==='warn'?'':'why'}">${md(x.answer)}</div>`:'';
  return `<div class="m a tc" data-task="${esc(x.task||'')}"><div class="hd"><span class="ti">${esc(x.title||'任务')}</span><span class="st ${waiting?'wait':st[1]}">${waiting?'等你点':esc(st[0])}</span>${running?'<button class="tag danger" onclick="chatStop()">停止</button>':''}${(x.state==='done'||x.state==='warn')&&(x.steps||[]).some(y=>y.kind==='step')?`<button class="tag" title="把这次做成功的步骤存成工作流草稿，去「工作流」页改好再用" onclick="wfDraft(${esc(JSON.stringify(x.task||''))})">存成工作流草稿</button>`:''}</div>
  ${steps||(running?'<div class="note">开始做…</div>':'')}${conf.map(askHtml).join('')}${ch.map(chooseHtml).join('')}${ans}</div>`}

  const d=await api('wf',{op:'draft_from_steps',name:(c.title||'任务')+'（草稿）',steps});if(!d.ok){snack(d.text);return}
  const r=await api('wf',{op:'save',workflow:d.workflow});snack(r.ok?'已存成工作流草稿「'+d.workflow.name+'」，去「工作流」页改好再运行':r.text)}

async function attFiles(files){for(const f of Array.from(files||[])){if(ATT.length>=6){snack('一次最多 6 个附件');break}

  if(!url){snack('读不出 '+f.name);continue}
  const a={name:f.name||('截图-'+Date.now()+'.png'),url:/^data:image\//.test(url)?url:'',kind:/^data:image\//.test(url)?'image':'file',busy:true};ATT.push(a);attRender();

  try{const r=await api('attach',{name:a.name,b64:url.replace(/^data:[^,]*,/,'')});if(r.ok){a.path=r.path;a.kind=r.kind;a.busy=false}else{snack(r.text||'附件没加上');ATT.splice(ATT.indexOf(a),1)}}

// [workflow-1120] 工作流页：第一次打开时才加载画布（/workflow.js，打包好的单文件，离线可用）
let wfLoaded=0;
function wfMount(){const el=$('workflows');if(wfLoaded===2||wfLoaded===1)return;
  if(window.OneSayWorkflow){wfLoaded=2;window.OneSayWorkflow.mount(el,{api,snack,live:LIVE});return}
  wfLoaded=1;el.innerHTML='<div class="card"><div class="empty">正在加载工作流画布…</div></div>';
  const sc=document.createElement('script');sc.src='/workflow.js';
  sc.onload=()=>{wfLoaded=2;window.OneSayWorkflow.mount(el,{api,snack,live:LIVE})};
  sc.onerror=()=>{wfLoaded=0;el.innerHTML='<div class="card"><div class="empty">工作流画布没加载出来，切到别的页再回来试试</div></div>'};
  document.head.appendChild(sc)}
refresh();if(LIVE)setInterval(refresh,2500);
