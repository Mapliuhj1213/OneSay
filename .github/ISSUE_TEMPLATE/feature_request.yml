name: 功能建议 / Feature request
description: 先说清楚要解决什么问题，再说想法。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下遇到了什么不方便？现在是怎么凑合的？
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: 涉及哪个 App
      multiple: true
      options: [OneSay（助手）, OneSay Plan, OneSay Clock, 插件 API]
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的想法
      description: 可选。期望的行为、界面或说法。
  - type: dropdown
    id: scope
    attributes:
      label: 范围
      options:
        - 普通 Android 手机都能用
        - 需要 root / Shizuku
        - 只针对某个厂商 / 机型
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 其他
      description: 隐私、费用（会不会多调云端接口）、和已有功能的关系等。
