<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneSay</title>
<link rel="icon" href="favicon.ico">
<style>
/* 与手机计划 App 同一套：浅灰底、白色大圆角卡片、大标题、蓝色强调、文字 87% / 55% / 38%，每类一个颜色 */
:root{
  --bg:#F4F4F6; --card:#FFFFFF; --text:rgba(0,0,0,.87); --text2:rgba(0,0,0,.55); --text3:rgba(0,0,0,.38);
  --line:rgba(0,0,0,.08); --accent:#0381FE; --red:#E5484D; --green:#1FA463;
  --event:#3E7BFA; --todo:#FF9500; --ticket:#8E5CF7; --pickup:#1FA463; --auto:#00A3B4; --device:#5B6472;
  --r:22px; --r-s:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.app{display:flex;height:100vh}

/* ---------- 侧栏 ---------- */
.side{width:232px;flex:none;padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 14px}
.logo{width:30px;height:30px;border-radius:10px;background:#0A5BFF;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;letter-spacing:-.3px}
.brand b{font-size:18px;font-weight:600;letter-spacing:.2px}
.devchip{margin:0 6px 14px;padding:10px 12px;border-radius:var(--r-s);background:var(--card);display:flex;align-items:center;gap:10px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(31,164,99,.15);flex:none}
.dot.off{background:#B5B8BE;box-shadow:none}
.devchip .t{display:flex;flex-direction:column;line-height:1.35}
.devchip .t span{color:var(--text3);font-size:12px}
.grp{font-size:12px;color:var(--text3);padding:12px 12px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;color:var(--text);font-size:14px;width:100%;text-align:left}
.nav:hover{background:rgba(0,0,0,.04)}
.nav.on{background:var(--card);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:12px;flex:none}
.nav .n{margin-left:auto;color:var(--text3);font-size:12px;font-weight:400}
.side .grow{flex:1}
.ptt{margin:6px;padding:12px;border-radius:var(--r-s);background:var(--card);font-size:12px;color:var(--text2);line-height:1.6}
.key{display:inline-block;min-width:44px;padding:1px 8px;border:1px solid rgba(0,0,0,.15);border-bottom-width:2px;border-radius:6px;font-size:11px;color:var(--text);background:#fafafa;text-align:center}

/* ---------- 主区 ---------- */
.main{flex:1;overflow:auto;padding:30px 40px 120px}
.page{display:none;max-width:1000px;margin:0 auto}
.page.on{display:block}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}
.head h1{font-size:34px;font-weight:600;letter-spacing:.5px;line-height:1.1}
.head p{color:var(--text2);margin-top:8px;font-size:14px}
.head .sp{flex:1}
.btn{height:36px;padding:0 16px;border-radius:18px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.sec{display:flex;align-items:center;gap:8px;margin:18px 6px 8px;font-size:13px;font-weight:600;color:var(--text2)}
.sec:first-child{margin-top:0}
.sec i{width:4px;height:14px;border-radius:2px}
.sec span{font-weight:400;color:var(--text3)}
.card{background:var(--card);border-radius:var(--r);padding:6px 0;overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:12px 20px;position:relative;min-height:58px}
.item+.item:before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:var(--line)}
.bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.item .tx{flex:1;min-width:0}
.item .tt{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .st{font-size:12.5px;color:var(--text2);margin-top:3px}
.item.past .tt,.item.past .st{color:var(--text3)}
.item.done .tt{color:var(--text3);text-decoration:line-through}
.time{width:52px;flex:none;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
.time small{display:block;font-weight:400;color:var(--text3);font-size:12px}
.tag{font-size:11.5px;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.05);color:var(--text2);flex:none}
.tag.red{background:rgba(229,72,77,.1);color:var(--red)}
.tag.green{background:rgba(31,164,99,.1);color:var(--green)}
.tag.blue{background:rgba(3,129,254,.1);color:var(--accent)}
.pill{font-size:12px;font-weight:600;padding:5px 12px;border-radius:14px;flex:none}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--todo);flex:none}
.chk.on{background:var(--todo);position:relative}
.chk.on:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.code{font-size:22px;font-weight:600;letter-spacing:1px;font-variant-numeric:tabular-nums}
.empty{padding:26px 20px;text-align:center;color:var(--text3);font-size:13px}
.sw{width:42px;height:24px;border-radius:12px;background:#D4D6DA;position:relative;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}
.sw.on:after{left:21px}
.ticket{border-radius:var(--r);background:var(--card);padding:18px 22px;display:flex;gap:18px;align-items:center;margin-bottom:12px}
.ticket .stn{text-align:center;min-width:90px}
.ticket .stn b{font-size:24px;font-weight:600;display:block}
.ticket .mid{flex:1;text-align:center;color:var(--text3);font-size:12px}
.ticket .mid hr{border:0;border-top:1px dashed rgba(0,0,0,.2);margin:6px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{background:var(--card);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.tile .tt{font-size:15px;font-weight:600}
.tile .st{font-size:12.5px;color:var(--text2);line-height:1.5}
.tile .row{display:flex;gap:6px;margin-top:auto}
.kv{display:flex;align-items:center;gap:14px;padding:14px 20px;position:relative}
.kv+.kv:before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:var(--line)}
.kv .k{flex:1}
.kv .k div{font-size:15px}
.kv .k p{font-size:12.5px;color:var(--text2);margin-top:3px}
.kv .v{color:var(--text2);font-size:13px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg span{padding:5px 12px;border-radius:8px;font-size:12.5px;color:var(--text2);cursor:pointer}
.seg span.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{height:32px;border-radius:10px;background:var(--bg);padding:0 12px;display:flex;align-items:center;min-width:220px;color:var(--text2);font-size:13px}
.hero{background:var(--card);border-radius:var(--r);padding:22px 24px;display:flex;align-items:center;gap:18px;margin-bottom:6px}
.hero .big{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:24px;flex:none}
.hero h2{font-size:20px;font-weight:600}
.hero p{color:var(--text2);font-size:13px;margin-top:4px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 6px}
.act{background:var(--card);border-radius:var(--r-s);padding:16px;display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600;text-align:left}
.act span{font-size:12px;color:var(--text3);font-weight:400}
.act .ic{width:30px;height:30px;border-radius:10px;font-size:14px}
.qr{width:150px;height:150px;border-radius:14px;background:#fff;border:1px solid var(--line);padding:10px}
.log{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px;color:var(--text2);line-height:1.9;padding:14px 20px}
.log b{color:var(--text);font-weight:400}
.note{font-size:12px;color:var(--text3);margin:10px 6px 0;line-height:1.6}

/* ---------- 说话浮条（实际在屏幕底部居中，任何程序之上） ---------- */
.voice{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;transition:.18s;
  background:#1F2228;color:#fff;border-radius:28px;padding:12px 24px;display:flex;align-items:center;gap:12px;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.25);white-space:nowrap}
.voice.show{opacity:1;transform:translateX(-50%) translateY(0)}
.voice .rec{width:10px;height:10px;border-radius:50%;background:#FF453A;animation:pulse 1s infinite}
.wave{display:flex;gap:3px;align-items:center;height:18px}
.wave i{width:3px;border-radius:2px;background:#fff;opacity:.85;animation:w .9s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
.voice .hint{color:rgba(255,255,255,.5);font-size:12px}
.voice .ok{color:#30D158}
@keyframes pulse{50%{opacity:.35}}
@keyframes w{0%,100%{height:4px}50%{height:18px}}
.demo{position:fixed;right:18px;bottom:18px;font-size:12px;color:var(--text3);background:var(--card);border-radius:12px;padding:8px 12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- 弹窗：设闹钟（设在手机上） ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center}
.mask.on{display:flex}
.sheet{width:420px;background:var(--card);border-radius:26px;padding:24px}
.sheet h3{font-size:18px;font-weight:600}
.sheet .sub{font-size:12.5px;color:var(--text2);margin-top:4px}
.clock{font-size:56px;font-weight:300;text-align:center;margin:22px 0 10px;font-variant-numeric:tabular-nums;letter-spacing:2px}
.days{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.days span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--bg);color:var(--text2)}
.days span.on{background:var(--accent);color:#fff}
.sheet .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
</style><style>
/* ---------- 对话（单一对话，类 Codex） ---------- */
#chat.on{display:flex}
#chat{flex-direction:column;height:calc(100vh - 30px);margin-top:-30px;max-width:none;padding-bottom:0}
.main.chatmode{padding-bottom:0;overflow:hidden}
.chatbar{display:flex;align-items:center;gap:10px;padding:18px 0 12px;max-width:820px;width:100%;margin:0 auto}
.chatbar h1{font-size:22px;font-weight:600}
.chip{font-size:12px;color:var(--text2);background:var(--card);border-radius:12px;padding:5px 10px;cursor:pointer}
.chip:hover{color:var(--accent)}
.msgs{flex:1;overflow:auto;padding:8px 0 24px}
.msgs .in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.m{line-height:1.75;font-size:15px;white-space:pre-wrap;word-break:break-word}
.m.u{align-self:flex-end;background:var(--card);border-radius:18px 18px 4px 18px;padding:10px 16px;max-width:78%}
.m.a{align-self:flex-start;max-width:100%;padding:0 4px}
.m.a.cmd{color:var(--text2);font-size:13.5px;display:flex;gap:8px;align-items:center}
.m.a.cmd:before{content:"⚡";color:var(--auto)}
.m.a.error{color:var(--red);font-size:13.5px}
.m .via{display:block;font-size:11px;color:var(--text3);margin-top:2px}
.m.typing{color:var(--text3)}
.compose{max-width:820px;width:100%;margin:0 auto 22px;background:var(--card);border-radius:20px;padding:12px 12px 10px 18px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;gap:10px;align-items:flex-end}
.compose textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:15px;line-height:1.6;max-height:180px;background:transparent;color:var(--text);padding:4px 0}
.compose .send{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px;flex:none}
.compose .send:disabled{background:#C9CCD1}
.hintline{max-width:820px;margin:-14px auto 14px;font-size:11.5px;color:var(--text3);text-align:center}
.welcome{margin:12vh auto 0;text-align:center;color:var(--text2)}
.welcome h2{font-size:26px;font-weight:600;color:var(--text);margin-bottom:10px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--card);box-shadow:-8px 0 30px rgba(0,0,0,.1);padding:24px;display:none;flex-direction:column;gap:12px;z-index:5}
.drawer.on{display:flex}
.drawer textarea{flex:1;border:0;background:var(--bg);border-radius:14px;padding:14px;font:inherit;font-size:13.5px;line-height:1.7;resize:none;outline:0}
/* ---------- 通知 ---------- */
.nk{font-size:11.5px;padding:3px 8px;border-radius:10px;flex:none;font-weight:600}
.nk.reminder{background:rgba(255,149,0,.12);color:#C66F00}.nk.auto{background:rgba(0,163,180,.12);color:var(--auto)}
.nk.rain{background:rgba(62,123,250,.12);color:var(--event)}.nk.app{background:rgba(0,0,0,.06);color:var(--text2)}.nk.pc{background:rgba(3,129,254,.1);color:var(--accent)}
.item.unread .tt{font-weight:600}
.badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;line-height:18px;font-weight:600}
/* ---------- 表单 ---------- */
input.field{border:0;outline:0;font:inherit;font-size:13px;color:var(--text)}
input.field::placeholder{color:var(--text3)}
.snack{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-60px);background:#1F2228;color:#fff;border-radius:14px;padding:10px 18px;font-size:13.5px;transition:.2s;z-index:9}
.snack.on{transform:translateX(-50%) translateY(0)}
.pairbox{font-family:Consolas,monospace;font-size:11.5px;word-break:break-all;background:var(--bg);border-radius:10px;padding:10px;color:var(--text2);margin-top:8px}
.addrow{display:flex;gap:10px;padding:12px 20px}
.addrow input{flex:1}
.demo-only{display:none}
.is-demo .demo-only{display:block}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">One</div><b>OneSay</b></div>
    <div class="devchip"><i class="dot" id="pdot"></i><div class="t"><span style="color:var(--text);font-size:13px" id="pline">手机离线</span><span id="pline2">等待手机连接</span></div></div>

    <button class="nav" data-p="chat"><span class="ic" style="background:linear-gradient(135deg,#0381FE,#00A3B4)">话</span>对话</button>
    <button class="nav on" data-p="today"><span class="ic" style="background:var(--accent)">今</span>今天</button>
    <button class="nav" data-p="notes"><span class="ic" style="background:var(--red)">铃</span>通知<span class="badge" id="nbadge" style="display:none"></span></button>

    <div class="grp">计划</div>
    <button class="nav" data-p="events"><span class="ic" style="background:var(--event)">日</span>日程<span class="n" id="c-events"></span></button>
    <button class="nav" data-p="todos"><span class="ic" style="background:var(--todo)">✓</span>待办<span class="n" id="c-todos"></span></button>
    <button class="nav" data-p="tickets"><span class="ic" style="background:var(--ticket)">票</span>票夹<span class="n" id="c-tickets"></span></button>
    <button class="nav" data-p="pickups"><span class="ic" style="background:var(--pickup)">件</span>取件<span class="n" id="c-pickups"></span></button>
    <button class="nav" data-p="autos"><span class="ic" style="background:var(--auto)">⟳</span>自动任务</button>
    <button class="nav" data-p="shortcuts"><span class="ic" style="background:var(--auto)">⚡</span>快捷指令</button>

    <div class="grp">设备</div>
    <button class="nav" data-p="phone"><span class="ic" style="background:var(--device)">▯</span>手机</button>
    <button class="nav" data-p="pc"><span class="ic" style="background:var(--device)">▭</span>这台电脑</button>

    <div class="grow"></div>
    <button class="nav" data-p="settings"><span class="ic" style="background:#8A8F98">⚙</span>设置</button>
    <div class="ptt" id="pttbox">按住 <span class="key">空格</span> 说话<br><span id="vstat">松手执行，Esc 取消</span></div>
  </aside>

  <main class="main" id="main">
    <section class="page" id="chat">
      <div class="chatbar"><h1>对话</h1><div class="sp" style="flex:1"></div><span class="chip" id="memchip" onclick="memOpen()">记忆</span><span class="chip" onclick="chatClear()">清空对话</span></div>
      <div class="msgs" id="msgs"><div class="in" id="msgin"></div></div>
      <div class="compose"><textarea id="ta" rows="1" placeholder="说点什么，或者直接下指令：锁屏、截图、打开B站…"></textarea><button class="send" id="sendbtn" onclick="chatSend()">↑</button></div>
      <div class="hintline" id="chathint">Enter 发送，Shift+Enter 换行 · 只有一个对话，旧内容自动截断，记忆自动更新、和手机共用</div>
    </section>
    <section class="page on" id="today"></section>
    <section class="page" id="notes"></section>
    <section class="page" id="events"></section>
    <section class="page" id="todos"></section>
    <section class="page" id="tickets"></section>
    <section class="page" id="pickups"></section>
    <section class="page" id="autos"></section>
    <section class="page" id="shortcuts"></section>
    <section class="page" id="phone"></section>
    <section class="page" id="pc"></section>
    <section class="page" id="settings"></section>
  </main>
</div>

<div class="drawer" id="drawer">
  <div style="display:flex;align-items:center"><h3 style="font-size:18px;font-weight:600;flex:1">记忆</h3><button class="btn ghost sm" onclick="memClose()">关闭</button></div>
  <div style="font-size:12.5px;color:var(--text2);line-height:1.6">对话时自动更新，和手机上的 OneSay 共用（新的覆盖旧的）。可以直接改。</div>
  <textarea id="memta" placeholder="还没有记忆。多聊几句，它会自己记下以后用得上的事。"></textarea>
  <div style="display:flex;gap:10px;justify-content:flex-end"><span id="memat" style="flex:1;font-size:12px;color:var(--text3);align-self:center"></span><button class="btn" onclick="memSave()">保存</button></div>
</div>

<div class="voice" id="voice"></div>
<button class="demo demo-only" onclick="cycle()">演示：说话浮条 ▸</button>
<div id="cfbox" style="display:none;position:fixed;right:24px;bottom:24px;z-index:50;max-width:380px;background:var(--card,#fff);border:1px solid var(--line,#ddd);border-radius:14px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.18)"></div>
<div class="snack" id="snack"></div>

<div class="mask" id="alarm" onclick="if(event.target===this)alarm(false)">
  <div class="sheet">
    <h3>设闹钟</h3><div class="sub">会设在手机上，由手机响</div>
    <div style="display:flex;justify-content:center;margin:20px 0 10px"><input class="clock" id="al-time" type="time" value="07:00" style="border:0;outline:0;font:inherit;font-size:56px;font-weight:300;text-align:center;background:transparent;color:var(--text)"></div>
    <div class="days" id="al-days"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="kv" style="padding:12px 0"><div class="k"><div>名字</div></div><input class="field" id="al-name" placeholder="闹钟" style="min-width:200px"></div>
    <div class="foot"><button class="btn ghost" onclick="alarm(false)">取消</button><button class="btn" onclick="alarmSet()">设到手机</button></div>
  </div>
</div>
<script src="qr.js"></script>
<script>
const TOKEN='__ONESAY_TOKEN__';
const LIVE=location.protocol.startsWith('http') && !TOKEN.startsWith('__');
if(!LIVE) document.body.classList.add('is-demo');
const $=id=>document.getElementById(id);

let snT;function snack(t){const s=$('snack');s.textContent=t;s.classList.add('on');clearTimeout(snT);snT=setTimeout(()=>s.classList.remove('on'),2600)}

// ---------- 格式 ----------
const pad=n=>String(n).padStart(2,'0');
const hm=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dayKey=ms=>new Date(new Date(ms).toDateString()).getTime();
const WK='日一二三四五六';
function dayName(ms){const k=dayKey(ms),t=dayKey(Date.now());const d=new Date(ms);
  if(k===t)return '今天 · 周'+WK[d.getDay()]; if(k===t+D)return '明天 · 周'+WK[d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 · 周'+WK[d.getDay()]}
function ago(ms){const s=(Date.now()-ms)/1000;if(s<60)return '刚刚';if(s<3600)return Math.floor(s/60)+' 分钟前';if(s<86400&&dayKey(ms)===dayKey(Date.now()))return hm(ms);return (new Date(ms).getMonth()+1)+'月'+new Date(ms).getDate()+'日 '+hm(ms)}
const KIND={reminder:'提醒',auto:'自动任务',rain:'降水',app:'手机通知',pc:'本机'};
const sec=(c,t,n)=>`<div class="sec"><i style="background:${c}"></i>${t}${n!=null?` <span>${n}</span>`:''}</div>`;
const empty=t=>`<div class="card"><div class="empty">${t}</div></div>`;
const head=(t,p,btn)=>`<div class="head"><div><h1>${t}</h1><p>${p}</p></div><div class="sp"></div>${btn||''}</div>`;
const SYNC='手机装上「电脑联动」插件后，手机计划里的内容会同步到这里';

function evItem(e){const past=(e.end||e.start)<Date.now();return `<div class="item ${past?'past':''}"><div class="bar" style="background:var(--event)"></div><div class="time">${hm(e.start)}${e.end?`<small>${Math.round((e.end-e.start)/6e4/6)/10} 小时</small>`:''}</div><div class="tx"><div class="tt">${esc(e.title)}</div><div class="st">${esc(e.note||'')}</div></div>${past?'<span class="tag">已过</span>':''}</div>`}
function todoItem(t){return `<div class="item ${t.done?'done':''}"><span class="chk ${t.done?'on':''}" style="cursor:pointer" onclick="todo('toggle','${esc(t.id)}')"></span><div class="tx"><div class="tt">${esc(t.title)}</div><div class="st">${esc(t.done?'已完成':(t.due||'无期限'))}</div></div>${/今天/.test(t.due||'')&&!t.done?'<span class="tag red">今天到期</span>':''}<button class="tag" onclick="todo('del','${esc(t.id)}')">删除</button></div>`}
function pkItem(p){return `<div class="item ${p.done?'past':''}"><div class="bar" style="background:var(--pickup)"></div><div class="tx"><div class="code">${esc(p.code)}</div><div class="st">${esc([p.place,p.deadline].filter(Boolean).join(' · '))}</div></div>${p.done?'<span class="tag">已取</span>':''}</div>`}
function tkItem(k){return `<div class="item"><div class="bar" style="background:var(--ticket)"></div><div class="tx"><div class="tt">${esc(k.title)}</div><div class="st">${k.at?dayName(k.at).split(' ')[0]+' '+hm(k.at):''}${k.seat?' · '+esc(k.seat):''}${k.code?' · 取票码 '+esc(k.code):''}</div></div></div>`}
function autoItem(a){return `<div class="item ${a.enabled?'':'past'}"><div class="bar" style="background:var(--auto)"></div><div class="tx"><div class="tt">${esc(a.title)}</div><div class="st">${esc(a.desc||'')}</div></div><span class="tag ${a.device==='电脑'?'blue':''}">${esc(a.device||'手机')}</span><span class="sw ${a.enabled?'on':''}"></span></div>`}
function noteItem(n){return `<div class="item ${n.read?'':'unread'}"><span class="nk ${esc(n.kind)}">${KIND[n.kind]||'通知'}</span><div class="tx"><div class="tt">${esc(n.title)}</div><div class="st">${esc(n.text)}</div></div><span class="tag">${ago(n.at)}</span></div>`}
const card=a=>`<div class="card">${a.join('')}</div>`;

// ---------- 各页 ----------
const P={};
P.today=()=>{
  const k=dayKey(Date.now()), ev=S.events.filter(e=>dayKey(e.start)===k).sort((a,b)=>a.start-b.start);
  const td=S.todos.filter(t=>!t.done), pk=S.pickups.filter(p=>!p.done), tk=S.tickets.filter(t=>!t.at||t.at>Date.now()-2*H).sort((a,b)=>(a.at||0)-(b.at||0)).slice(0,2);
  const nt=S.notes.slice().reverse().slice(0,3), au=S.autos.filter(a=>a.enabled);
  const d=new Date();
  return head('今天',`${d.getMonth()+1}月${d.getDate()}日 周${WK[d.getDay()]} · ${ev.length} 个日程 · ${td.length} 件待办 · ${pk.length} 个待取件`,`<button class="btn" onclick="go('chat')">问 OneSay</button>`)+
  `<div class="cols"><div>${sec('var(--event)','日程',ev.length+' 个')}${ev.length?card(ev.map(evItem)):empty('今天没有日程')}
  ${sec('var(--todo)','待办',td.length+' 件')}${card([...td.map(todoItem),addRow()])}</div>
  <div>${nt.length?sec('var(--red)','最新通知')+card(nt.map(noteItem)):''}
  ${pk.length?sec('var(--pickup)','待取件',pk.length+' 个')+card(pk.map(pkItem)):''}
  ${tk.length?sec('var(--ticket)','临近的票')+card(tk.map(tkItem)):''}
  ${au.length?sec('var(--auto)','开着的自动任务',au.length+' 个')+card(au.map(autoItem)):''}
  ${!nt.length&&!pk.length&&!tk.length&&!au.length?sec('var(--text3)','手机')+empty(SYNC):''}</div></div>`};
const addRow=()=>`<div class="addrow"><input class="field newtodo" placeholder="记一条待办，回车保存" onkeydown="if(event.key==='Enter')todoAdd(this)"></div>`;
P.notes=()=>{const n=S.notes.slice().reverse();
  return head('通知',`提醒、自动任务、降水和手机 App 通知都弹在电脑右下角，这里留底`,`<button class="btn ghost" onclick="notes('test')">发一条测试</button> <button class="btn ghost" onclick="notes('read')">全部已读</button> <button class="btn ghost" onclick="notes('clear')">清空</button>`)+
  (n.length?card(n.map(noteItem)):empty('还没有通知。手机装上「电脑联动」插件后，手机的提醒会转到这里'))};
P.events=()=>{const e=S.events.slice().sort((a,b)=>a.start-b.start).filter(x=>(x.end||x.start)>dayKey(Date.now()));
  if(!e.length)return head('日程','接下来没有日程')+empty(SYNC);
  const g={};e.forEach(x=>(g[dayKey(x.start)]=g[dayKey(x.start)]||[]).push(x));
  return head('日程',`共 ${e.length} 条`)+Object.keys(g).map(k=>sec('var(--event)',dayName(+k))+card(g[k].map(evItem))).join('')};
P.todos=()=>{const a=S.todos.filter(t=>!t.done),b=S.todos.filter(t=>t.done);
  return head('待办',a.length?`还有 ${a.length} 件没做`:'都做完了')+card([...a.map(todoItem),addRow()])+(b.length?sec('var(--text3)','已完成',b.length+' 件')+card(b.map(todoItem)):'')};
P.tickets=()=>head('票夹',S.tickets.length+' 张')+(S.tickets.length?card(S.tickets.map(tkItem)):empty(SYNC));
P.pickups=()=>{const a=S.pickups.filter(p=>!p.done),b=S.pickups.filter(p=>p.done);
  return head('取件',a.length+' 个待取')+(a.length?card(a.map(pkItem)):empty(SYNC))+(b.length?sec('var(--text3)','取过的')+card(b.map(pkItem)):'')};
P.autos=()=>head('自动任务','触发后的结果会通过通知弹到电脑上')+(S.autos.length?card(S.autos.map(autoItem)):empty(SYNC))+`<p class="note">每条标明在哪台设备上执行。对方离线时不排队。</p>`;
P.shortcuts=()=>{const s=S.shortcuts;
  return head('快捷指令','说名字就执行，只回一句「正在执行快捷指令」')+
  (S.settings.scripts_dir?(s.length?`<div class="grid3">${s.map(n=>`<div class="tile"><span class="tag blue" style="align-self:flex-start">电脑</span><div class="tt">${esc(n)}</div><div class="st">说「${esc(n)}」或「执行${esc(n)}」</div><div class="row"><button class="btn sm" onclick="runSc('${esc(n)}')">运行</button></div></div>`).join('')}</div>`:empty('文件夹里还没有 .ps1 / .bat / .cmd 脚本')):empty('还没设快捷指令文件夹，去设置里填'))+
  `<p class="note">快捷指令文件夹：${esc(S.settings.scripts_dir||'未设置')} · 每个脚本最多跑 60 秒 · 成败由你判断。</p>`+scPolicy()};
const SC_ST={approved:['green','手机可直接执行'],changed:['red','内容改过，要重新批准'],new:['','手机触发时先问你'],blocked:['red','不能批准远程直接执行'],missing:['','文件已不在']};
function scPolicy(){const p=S.shortcut_policy||[],a=S.shortcut_approvals||[];
  return sec('var(--auto)','手机触发','第一次（或内容改过）会在这里问你，可选「以后直接执行」')+
  (p.length?card(p.map(x=>{const t=SC_ST[x.status]||SC_ST.new;return `<div class="item"><div class="tx"><div class="tt">${esc(x.name)}</div><div class="st">${esc(x.why||t[1])}</div></div><span class="tag ${t[0]}">${esc(t[1])}</span></div>`})):empty('没有快捷指令'))+
  sec('var(--green)','已批准直接执行',a.length+' 个')+
  (a.length?card(a.map(x=>{const t=SC_ST[x.status]||SC_ST.approved;return `<div class="item"><div class="tx"><div class="tt">${esc(x.name)}</div><div class="st">内容指纹 ${esc(x.hash)} · ${esc(t[1])}</div></div><button class="tag" onclick="scRevoke(${esc(JSON.stringify(x.id))})">撤销</button></div>`})):empty('还没有批准过'))+
  `<p class="note">只认快捷指令文件夹里的 .ps1 / .bat / .cmd，按文件名 + 内容指纹批准；改了内容或改了名都要重新批准。普通用户自己能做的（改自己的注册表、删自己的文件、开程序…）照常批准；需要管理员（机器级注册表、服务驱动、防火墙 / 网卡 / DNS、系统级计划任务、磁盘）、能影响提权（劫持 ms-settings 之类、改 windir / COR_PROFILER、Policies）、想提权，或用了看不出内容的编码命令的，只能你自己运行。注释里写到的词不算。只读档一律不执行。</p>`}

let lastChatLen=-1;
function renderChat(){const c=S.chat, box=$('msgin');

  $('memchip').textContent='记忆 · '+(lines?lines+' 条':'空')+(m.updated_at?' · '+ago(m.updated_at):'');
  if(c.length===lastChatLen&&!pending)return; lastChatLen=c.length;
  box.innerHTML=(c.length?c.map(x=>`<div class="m ${x.role==='user'?'u':'a'} ${x.via==='cmd'?'cmd':''} ${x.via==='error'?'error':''}">${esc(x.text)}${x.via==='voice'&&x.role==='user'?'<span class="via">语音</span>':''}</div>`).join(''):
   `<div class="welcome"><h2>想让电脑做什么？</h2><div>直接说指令（锁屏、截图、打开B站），或者随便聊。<br>${S.settings.llm_key_set?'':'设置里填上大模型 Key 才能聊天，指令不需要 Key。'}</div></div>`)+(pending?'<div class="m a typing">思考中…</div>':'');
  $('msgs').scrollTop=1e9}
async function chatSend(){const ta=$('ta'),t=ta.value.trim();if(!t||pending)return;ta.value='';fit();
  if(!LIVE){S.chat.push({id:Math.random()+'',role:'user',text:t,at:Date.now()},{id:Math.random()+'',role:'assistant',text:'（演示模式，不会真的回答）',at:Date.now()});renderChat();return}
  S.chat.push({role:'user',text:t,at:Date.now()});pending=true;renderChat();
  try{await api('chat',{text:t})}catch(e){snack('发送失败')}pending=false;lastChatLen=-1;await refresh()}
async function chatClear(){if(!confirm('清空对话？记忆会保留。'))return;await api('chat_clear',{});lastChatLen=-1;refresh()}
function fit(){const ta=$('ta');ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,180)+'px'}
$('ta').addEventListener('input',fit);
$('ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();chatSend()}});

  el.value='';el.blur();const r=await api('todo',{op:'add',title:v});if(!r.ok)snack(r.text);await refresh();const n=$(page).querySelector('.newtodo');n&&n.focus()}

async function runSc(n){const r=await api('run',{cmd:'shortcut_run',args:{name:n}});snack(r.text)}
async function phone(cmd,args){snack('正在发给手机…');const r=await api('phone',{cmd,args:args||{}});
  const d=r.data||{};let t=r.text;if(r.ok&&d.files)t+='：'+d.files.slice(0,8).join('、')+(d.files.length>8?'…':'');if(r.ok&&d.scripts)t+='：'+(d.scripts.join('、')||'没有');if(r.ok&&d.output)t+='：'+String(d.output).slice(0,120);snack(t)}
function phoneSet(){const n=(prompt('改手机上的哪个设置？\nbrightness 亮度 / volume 音量 / screen_timeout 屏幕超时（秒）/ dnd 勿扰 / ringer 铃声模式 / wifi / bluetooth，以及 airplane、mobile_data、location 等（走特权通道）','brightness')||'').trim();if(!n)return;
  const v=(prompt('改成什么？（数字，或 on / off）','50')||'').trim();if(!v)return;phone('setting_set',{name:n,value:v})}
function phoneFile(){const p=(prompt('写到手机工作区里的哪个文件？（相对路径，如 inbox/a.txt）','inbox/note.txt')||'').trim();if(!p)return;const t=prompt('文件内容','');if(t===null)return;phone('file_write',{path:p,text:t})}
function phoneUninstall(){const p=(prompt('卸载哪个 App？（包名，如 com.example.app；手机上还要你点确定）','')||'').trim();if(!p)return;phone('uninstall_app',{package:p})}
function phoneScript(){const n=(prompt('运行手机工作区 scripts/ 里的哪个脚本？（文件名，.sh）','')||'').trim();if(!n)return;phone('script_run',{name:n})}
function phoneExec(){const c=(prompt('在手机上执行的命令（走手机的特权通道，按你在手机上开着的开关）','')||'').trim();if(!c)return;if(!confirm('在手机上执行：\n'+c))return;phone('sys_exec',{command:c})}
function phoneVol(){const v=prompt('手机媒体音量（0–100）','30');if(v===null)return;const n=parseInt(v,10);if(!(n>=0&&n<=100)){snack('要在 0–100');return}phone('volume_set',{percent:n})}
function phoneUrl(){const u=(prompt('在手机上打开的网址','https://')||'').trim();if(!u||u==='https://')return;phone('open_url',{url:/^https?:\/\//.test(u)?u:'https://'+u})}
function phoneApp(){const n=(prompt('打开手机上的哪个 App？（写桌面上的名字，或包名如 com.tencent.mm）','')||'').trim();if(!n)return;phone('open_app',/^[a-z][a-z0-9_]*(\.[a-z0-9_]+)+$/i.test(n)?{package:n}:{name:n})}
function phoneNote(){const t=(prompt('发到手机的通知内容','')||'').trim();if(!t)return;phone('notify',{title:'电脑提醒',text:t})}
async function unpin(){if(!confirm('忘掉已配对手机的证书？手机下次加密连上时会重新记住（手机重装 / 清过数据后连不上时用）。'))return;const r=await api('pairing',{op:'unpin'});snack(r.text)}
const SB_ZH={read_only:'只读',workspace_write:'工作区可写',full_access:'完全访问'},AP_ZH={untrusted:'分类',on_request:'按需',never:'从不'};
const seg2=(key,val,opts)=>`<div class="seg">${opts.map(([v,l])=>`<span class="${v===val?'on':''}" onclick="setAxis('${key}','${v}')">${l}</span>`).join('')}</div>`;
function setAxis(k,v){if(k==='pc_sandbox'&&v==='full_access'&&!confirm('打开「完全访问」？\n\n手机发来的指令将按这台电脑当前用户的权限执行：可以写工作区以外的文件、操作第三方程序、联网。\n\n仍然不会：提权 / 弹 UAC、做要管理员的事（只生成脚本）、改 OneSay 自己的设置。\n\n只在你信任这台手机时打开。'))return;
  if(k==='pc_approval'&&v==='never'&&!confirm('审批策略改成「从不」？\n\n以后不会再弹确认：要确认的事直接拒绝；如果沙箱档是完全访问，关机、卸载、跑脚本、执行命令会直接执行。'))return;setv(k,v)}
const plugSw=on=>`<span class="sw ${on?'on':''}" style="cursor:pointer" onclick="setPlugin(${!on})"></span>`;
async function setPlugin(on){if(on){setv('plugin_enabled',true);return}
  if(!confirm('关掉安全插件？\n\n关掉后不再拦截编码 / 隐藏命令。永不提权、需要管理员只生成脚本、禁止自授权这三项关不掉。'))return;
  if(!confirm('再确认一次：真的关掉安全插件？'))return;
  if(!LIVE){S.settings.plugin_enabled=false;render();return}
  const r=await api('settings',{plugin_enabled:false,plugin_off_confirm:true});snack(r.text);refresh()}
const levelSeg=v=>`<div class="seg">${[['read_only','只读'],['auto','自动'],['full','完全访问']].map(([k,l])=>`<span class="${k===(v||'auto')?'on':''}" onclick="setLevel('${k}')">${l}</span>`).join('')}</div>`;
function setLevel(k){if(k==='full'&&!confirm('打开「完全访问」？\n\n手机发来的指令将可以：运行电脑工作区 scripts/ 里已有的脚本（每次仍要你确认）、操作第三方程序。\n\n仍然只生成脚本、不会执行的：注册表、网络配置、服务驱动、工作区以外的文件、任何授权。\n\n只在你信任这台手机时打开。'))return;setv('pc_level',k)}
// 确认框（思路参考 Haris 审批卡，MIT：0.7 秒后才能点「允许」、Esc / 关窗口 / 超时即拒、说话不算批准；代码自己写的）
// 规则以电脑端 ConfirmGate 为准：这里只是照着画，「允许」要等程序回了 seen 之后再计 0.7 秒；窗口切走马上锁住，切回来重新计。
let cfShown='',cfArmT=0,cfArmMs=700,cfId=0;
function cfLock(){clearTimeout(cfArmT);document.querySelectorAll('#cfbox .cfallow').forEach(b=>b.disabled=true);const h=$('cfhint');if(h)h.textContent='「允许」稍后可点（防误点）'}
function cfArm(){clearTimeout(cfArmT);if(!cfId||!document.hasFocus())return;
  cfArmT=setTimeout(()=>{if(!document.hasFocus())return;document.querySelectorAll('#cfbox .cfallow').forEach(b=>b.disabled=false);const h=$('cfhint');if(h)h.textContent='只认鼠标 / 键盘点击（或手机屏幕上的确认卡）；60 秒不点、关窗口、按 Esc 都算拒绝'},cfArmMs)}
function confirmBar(){const c=(S&&S.confirms)||[];const box=$('cfbox');if(!box)return;
  if(!c.length){box.style.display='none';cfShown='';cfId=0;clearTimeout(cfArmT);return}
  const x=c[0],key=String(x.id);if(cfShown===key)return;cfShown=key;cfId=x.id;
  box.innerHTML=`<div style="font-weight:600;margin-bottom:6px">手机请求，需要你确认</div><div style="margin-bottom:10px;word-break:break-all">${esc(x.detail)}</div>${x.remember_kind?`<label class="note" style="display:block;margin:0 0 8px"><input type="checkbox" id="cfrem"> 以后这类不用问（${esc(x.remember_zh||x.remember_kind)}，可在设置里撤销）</label>`:''}${x.phone?'<div class="note" style="margin:0 0 6px">已同时发到手机，手机屏幕上点也行</div>':''}<div class="note" id="cfhint" style="margin:0 0 10px">「允许」稍后可点（防误点）</div><button class="btn sm cfallow" disabled onkeydown="if(event.repeat)event.preventDefault()" onclick="cfAns(${x.id},true,false,event)">允许${x.always?'':'一次'}</button> ${x.always?`<button class="btn sm cfallow" disabled onkeydown="if(event.repeat)event.preventDefault()" onclick="cfAns(${x.id},true,true,event)">以后直接执行</button> `:''}<button class="btn ghost sm" id="cfdeny" onclick="cfAns(${x.id},false,false,event)">拒绝</button>`;
  box.style.display='';const d=$('cfdeny');if(d)d.focus(); // 焦点默认在「拒绝」：误按回车 / 空格 = 拒绝
  if(!LIVE){cfArm();return}
  api('confirm',{op:'seen',id:x.id,focused:document.hasFocus()}).then(r=>{if(r&&r.arm_ms)cfArmMs=r.arm_ms;if(cfId===x.id)cfArm()}).catch(()=>{})}
async function cfAns(id,allow,always,ev){
  const trusted=!!(ev&&ev.isTrusted),input=ev&&ev.detail===0?'keyboard':'mouse';
  if(allow&&!trusted)return; // 不是真实的鼠标 / 键盘输入：不算
  const rb=$('cfrem'),remember=!!(allow&&!always&&rb&&rb.checked);
  let r;try{r=await api('confirm',{id,allow,always:!!always,remember,input,trusted})}catch(e){r={ok:false,text:'没连上 OneSay'}}
  if(r&&r.reason==='not_armed'){snack(r.text);cfLock();cfArm();return}
  cfShown='';cfId=0;clearTimeout(cfArmT);snack(r.text);refresh()}
function cfWindow(f){if(!cfId)return;if(!f)cfLock();if(LIVE)api('confirm',{op:'window',focused:f}).catch(()=>{});if(f){cfLock();cfArm()}}
window.addEventListener('blur',()=>cfWindow(false));
window.addEventListener('focus',()=>cfWindow(true));
document.addEventListener('visibilitychange',()=>cfWindow(document.visibilityState==='visible'&&document.hasFocus()));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cfId){e.preventDefault();e.stopPropagation();cfAns(cfId,false,false,e)}},true);
// 窗口关闭：在等的请求按拒绝（程序那边界面 8 秒没动静也会按拒绝）
window.addEventListener('pagehide',()=>{if(!LIVE||!cfId)return;try{fetch('/api/confirm',{method:'POST',keepalive:true,headers:{'X-OneSay-Token':TOKEN,'Content-Type':'application/json'},body:JSON.stringify({op:'closed'})})}catch(e){}});
async function setv(k,v){if(!LIVE){S.settings[k]=v;if(k==='llm_key'||k==='asr_key')S.settings[k+'_set']=!!v;render();return}
  const r=await api('settings',{[k]:v});snack(r.text);if(r.settings)S.settings=r.settings;render()}
async function testLlm(){snack('测试中…');const r=await api('test_llm',{});snack(r.text)}
async function showPair(){pairShown=!pairShown;if(!pairShown){lastPair='';render();return}
  let s='onesay://pair?key=DEMO&peer=pc-desktop&lan=192.168.1.20:47820';if(LIVE){const r=await api('pairing',{});s=r.pairing}
  render();drawQr(s)}
function drawQr(s){lastPair=s;try{const q=qrcode(0,'M');q.addData(s);q.make();$('qrbox').innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});
  $('pairtxt').innerHTML=`<div class="pairbox">${esc(s)}</div><button class="btn ghost sm" style="margin-top:6px" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(s))});snack('已复制')">复制配对串</button>`}catch(e){$('qrbox').textContent='二维码生成失败'}}
async function rekey(){if(!confirm('换钥匙后，已配对的手机要重新扫码。继续？'))return;const r=await api('pairing',{op:'rekey'});pairShown=true;render();if(r.pairing)drawQr(r.pairing);snack('已换新钥匙')}
function alarm(on){$('alarm').classList.toggle('on',on)}
$('al-days').querySelectorAll('span').forEach(x=>x.onclick=()=>x.classList.toggle('on'));
async function alarmSet(){const days=[...$('al-days').children].map((x,i)=>x.classList.contains('on')?i+1:0).filter(Boolean);
  alarm(false);phone('alarm_set',{time:$('al-time').value,days,label:$('al-name').value||'闹钟'})}

// ---------- 渲染与切页 ----------
function render(){if(!S)return;
  confirmBar();
  const ids=Object.keys(S.peers),on=ids.length>0;
  $('pdot').classList.toggle('off',!on);$('pline').textContent=on?'手机在线':'手机离线';$('pline2').textContent=on?S.peers[ids[0]]+' · '+ids[0]:'等待手机连接';
  $('vstat').textContent=(S.voice||'松手执行，Esc 取消')+(S.asr_engine&&S.asr_engine!=='none'?' · 识别：'+S.asr_engine_zh:'');
  for(const k of ['events','todos','tickets','pickups']){const n=k==='todos'?S.todos.filter(t=>!t.done).length:k==='pickups'?S.pickups.filter(p=>!p.done).length:S[k].length;$('c-'+k).textContent=n||''}
  const un=S.notes.filter(n=>!n.read).length;$('nbadge').style.display=un?'':'none';$('nbadge').textContent=un;
  if(page==='chat'){renderChat();return}
  const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&$(page).contains(ae))return; // 正在输入时不重绘
  $(page).innerHTML=P[page]();if(page==='settings'&&pairShown&&lastPair)drawQr(lastPair)}
function go(p){page=p;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.p===p));
  document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===p));$('main').classList.toggle('chatmode',p==='chat');
  if(p!=='settings')pairShown=false;
  if(p==='notes'&&S&&S.notes.some(n=>!n.read))setTimeout(()=>notes('read'),1500);
  lastChatLen=-1;render();if(p==='chat')$('ta').focus()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.p));

let vk=0;function cycle(){vk=(vk+1)%VS.length;V.innerHTML=VS[vk];V.classList.toggle('show',vk>0)}

refresh();if(LIVE)setInterval(refresh,2500);
